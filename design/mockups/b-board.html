<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup B: Board-first · Onyx Sheiko</title>
  <!-- Mockup only: Tailwind's in-browser build, pinned with an integrity hash. The real app ships built CSS. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
          integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
          crossorigin="anonymous"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="data.js"></script>
  <script src="shared.js"></script>
</head>
<body class="min-h-screen bg-zinc-100 text-sm text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
  <header class="sticky top-0 z-10 flex h-14 items-center gap-3 border-b border-zinc-200 bg-white/80 px-5 backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/80">
    <span class="text-base font-semibold tracking-tight">Onyx</span>
    <span class="rounded bg-amber-100 px-1.5 py-0.5 text-[10px] font-medium text-amber-900 dark:bg-amber-950 dark:text-amber-300">B · Board-first</span>
    <div class="ml-6 flex rounded-lg bg-zinc-100 p-0.5 dark:bg-zinc-800">
      <button data-mode="board" class="mode rounded-md px-3 py-1">Board</button>
      <button data-mode="list" class="mode rounded-md px-3 py-1">List</button>
    </div>
    <select id="project" class="ml-2 rounded-md border border-zinc-200 bg-white px-2 py-1 dark:border-zinc-700 dark:bg-zinc-900">
      <option value="">All projects</option><option>Atlas</option><option>Harbor</option><option>Admin</option>
    </select>
    <button data-palette-open class="ml-auto rounded-md border border-zinc-200 px-2.5 py-1 text-zinc-500 dark:border-zinc-700">Search <kbd class="ml-2 text-[10px]">⌘K</kbd></button>
    <button id="notes-btn" class="rounded-md border border-zinc-200 px-3 py-1 hover:bg-zinc-50 dark:border-zinc-700 dark:hover:bg-zinc-800">Notes</button>
    <button class="rounded-md bg-amber-500 px-3 py-1 font-medium text-zinc-950 hover:bg-amber-400">+ Task</button>
    <button data-theme-toggle class="rounded px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-800" aria-label="Toggle theme">◐</button>
  </header>

  <main id="main" class="p-5"></main>

  <!-- Slide-over for notes and task details -->
  <div id="overlay" class="fixed inset-0 z-20 hidden bg-black/30"></div>
  <aside id="slide" class="fixed inset-y-0 right-0 z-30 w-[32rem] max-w-full translate-x-full overflow-auto bg-white shadow-2xl transition-transform dark:bg-zinc-900"></aside>

  <script>
    document.body.insertAdjacentHTML("beforeend", PALETTE_HTML)
    let mode = "board"
    let project = ""

    const visible = () => MOCK.tasks.filter((t) => !project || t.project === project)

    function card(t) {
      const next = nextStage(t.status)
      return `
        <div class="group rounded-lg border border-zinc-200 bg-white p-3 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
          <button data-open-task="${t.id}" class="mb-2 block text-left font-medium hover:underline">${esc(t.title)}</button>
          <div class="flex items-center gap-1.5">${pill(t.priority, PRIORITY_CLASSES[t.priority])}<span class="text-xs text-zinc-500">${esc(t.project)} · due ${esc(t.due.slice(5))}</span></div>
          ${next ? `<button data-advance="${t.id}" class="mt-3 w-full rounded-md border border-dashed border-zinc-300 py-1 text-xs text-zinc-500 opacity-70 group-hover:opacity-100 hover:border-zinc-400 hover:text-zinc-800 dark:border-zinc-700 dark:hover:text-zinc-200">Move to ${esc(MOCK.stageLabels[next])} →</button>` : ""}
        </div>`
    }

    function drawBoard() {
      document.getElementById("main").innerHTML = `
        <div class="grid grid-cols-4 gap-4">${MOCK.stages.map((s) => {
          const items = visible().filter((t) => t.status === s)
          return `
            <section class="flex min-h-[70vh] flex-col rounded-xl bg-zinc-200/60 p-3 dark:bg-zinc-900/60">
              <h2 class="mb-3 flex items-center gap-2 font-semibold">${pill(MOCK.stageLabels[s], STAGE_CLASSES[s])}<span class="text-zinc-500">${items.length}</span></h2>
              <div class="space-y-2">${items.map(card).join("") || '<p class="px-1 text-xs text-zinc-500">Nothing here</p>'}</div>
            </section>`
        }).join("")}</div>
        <p class="mt-4 text-xs text-zinc-500">Tasks move one stage at a time. Moving to Done asks for a sign-off.</p>`
      wire()
    }

    function drawList() {
      document.getElementById("main").innerHTML = `
        <div class="overflow-hidden rounded-xl border border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900">
          <table class="w-full text-left">
            <thead class="bg-zinc-50 text-xs uppercase tracking-wide text-zinc-500 dark:bg-zinc-800/50"><tr><th class="px-4 py-2">Title</th><th>Stage</th><th>Priority</th><th>Due</th><th>Project</th><th></th></tr></thead>
            <tbody>${visible().map((t) => `
              <tr class="border-t border-zinc-200 dark:border-zinc-800">
                <td class="px-4 py-2"><button data-open-task="${t.id}" class="hover:underline">${esc(t.title)}</button></td>
                <td>${pill(MOCK.stageLabels[t.status], STAGE_CLASSES[t.status])}</td><td>${pill(t.priority, PRIORITY_CLASSES[t.priority])}</td>
                <td class="text-zinc-500">${esc(t.due)}</td><td class="text-zinc-500">${esc(t.project)}</td>
                <td class="pr-4 text-right">${nextStage(t.status) ? `<button data-advance="${t.id}" class="text-xs text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100">→ ${esc(MOCK.stageLabels[nextStage(t.status)])}</button>` : ""}</td></tr>`).join("")}
            </tbody></table></div>`
      wire()
    }

    function openSlide(html) {
      const s = document.getElementById("slide")
      s.innerHTML = `<div class="flex justify-end p-3"><button id="close-slide" class="rounded px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-800" aria-label="Close">✕</button></div><div class="px-8 pb-10">${html}</div>`
      s.classList.remove("translate-x-full")
      document.getElementById("overlay").classList.remove("hidden")
      document.getElementById("close-slide").addEventListener("click", closeSlide)
      s.querySelectorAll("[data-note]").forEach((b) => b.addEventListener("click", () => openNote(b.dataset.note)))
      s.querySelectorAll(".wikilink").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); const id = noteIdByTitle(a.dataset.title); if (id) openNote(id) }))
    }
    function closeSlide() {
      document.getElementById("slide").classList.add("translate-x-full")
      document.getElementById("overlay").classList.add("hidden")
    }

    function openTask(id) {
      const t = MOCK.tasks.find((x) => x.id === id)
      const notes = Object.entries(MOCK.notes).filter(([, n]) => n.tags.includes(t.project.toLowerCase()))
      openSlide(`
        <h2 class="mb-2 text-xl font-semibold">${esc(t.title)}</h2>
        <div class="mb-6 flex gap-1.5">${pill(MOCK.stageLabels[t.status], STAGE_CLASSES[t.status])}${pill(t.priority, PRIORITY_CLASSES[t.priority])}<span class="text-xs text-zinc-500">due ${esc(t.due)}</span></div>
        <h3 class="mb-2 text-xs font-medium uppercase tracking-wide text-zinc-500">Status history</h3>
        <ol class="mb-6 space-y-1 border-l border-zinc-200 pl-3 dark:border-zinc-800">${t.history.map((h) => `<li>${esc(h)}</li>`).join("")}</ol>
        <h3 class="mb-2 text-xs font-medium uppercase tracking-wide text-zinc-500">Related notes</h3>
        <ul class="space-y-1">${notes.map(([nid, n]) => `<li><button data-note="${esc(nid)}" class="text-amber-700 hover:underline dark:text-amber-400">${esc(n.title)}</button></li>`).join("") || '<li class="text-zinc-500">None</li>'}</ul>`)
    }

    function openNote(id) {
      const n = MOCK.notes[id]
      openSlide(`
        <div class="mb-1 text-xs text-zinc-500">${esc(n.folder)} · updated ${esc(n.updated)}</div>
        <h2 class="mb-4 text-xl font-semibold">${esc(n.title)}</h2>
        <article class="leading-relaxed">${renderBody(n.body)}</article>`)
    }

    function openNotesList() {
      openSlide(`
        <h2 class="mb-4 text-xl font-semibold">Notes</h2>
        ${MOCK.folders.map((f) => `
          <h3 class="mt-4 mb-1 text-xs font-medium uppercase tracking-wide text-zinc-500">${esc(f.name)}</h3>
          <ul class="space-y-1">${f.notes.map((id) => `<li><button data-note="${esc(id)}" class="hover:underline">${esc(MOCK.notes[id].title)}</button></li>`).join("")}</ul>`).join("")}`)
    }

    function wire() {
      document.querySelectorAll("[data-open-task]").forEach((b) => b.addEventListener("click", () => openTask(Number(b.dataset.openTask))))
      document.querySelectorAll("[data-advance]").forEach((b) => b.addEventListener("click", () => { advanceTask(Number(b.dataset.advance)); render() }))
    }

    function render() {
      document.querySelectorAll(".mode").forEach((b) => {
        b.className = "mode rounded-md px-3 py-1 " + (b.dataset.mode === mode ? "bg-white shadow-sm dark:bg-zinc-700" : "text-zinc-500")
      })
      mode === "board" ? drawBoard() : drawList()
    }

    document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.mode; render() }))
    document.getElementById("project").addEventListener("change", (e) => { project = e.target.value; render() })
    document.getElementById("notes-btn").addEventListener("click", openNotesList)
    document.getElementById("overlay").addEventListener("click", closeSlide)
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSlide() })
    initTheme()
    initPalette((item) => (item.kind === "Note" ? openNote(item.id) : openTask(item.id)))
    render()
  </script>
</body>
</html>
