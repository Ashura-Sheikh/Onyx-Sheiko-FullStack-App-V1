name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday 07:00 UTC: catches new advisories against unchanged code.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so every commit is scanned, not just the latest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails the job on any leak. PR comments are off: the token is read-only.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend

      # Audits exactly the versions in uv.lock, not whatever is newest.
      - name: Export locked dependencies
        run: uv export --format requirements-txt --no-emit-project -q -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Fails on high or critical advisories in package-lock.json.
      - name: npm audit
        run: npm audit --audit-level=high
